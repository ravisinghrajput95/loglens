name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

      # Offline evals need no model and are deterministic, so a regression in
      # tool correctness or verifier precision fails the build.
      - name: Evaluations
        run: python -m evals.run

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The README tells people to pip install this, so that path is checked
      # in a clean environment. A package that installs but cannot be run is
      # otherwise invisible until someone tries it.
      - name: Install into a clean environment and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install .
          /tmp/fresh/bin/loglens --version
          /tmp/fresh/bin/loglens report app.log | grep -q "ERROR PATTERNS"
