[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "AI log analysis agent for incident investigation, running against a local LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ravi Rajput" }]
keywords = ["logs", "sre", "devops", "observability", "langchain", "ollama", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
]

dependencies = [
    "langchain>=1.3,<2.0",
    "langchain-core>=1.5,<2.0",
    "langchain-ollama>=1.1,<2.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
# The browser view. Kept out of the base install so `loglens report` still
# runs on a clean Python with nothing but the parser's own dependencies.
ui = ["streamlit>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.6", "streamlit>=1.40"]

[project.scripts]
loglens = "loglens.cli:main"
loglens-ui = "loglens.ui_launch:main"

[project.urls]
Homepage = "https://github.com/ravisinghrajput95/loglens"
Issues = "https://github.com/ravisinghrajput95/loglens/issues"

[tool.setuptools.packages.find]
include = ["loglens*"]
exclude = ["evals*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root must be importable so tests can reach evals/, which is
# deliberately not packaged. Without this, `pytest` works only when invoked as
# `python -m pytest`, which silently adds the current directory — a difference
# that passed locally and failed in CI.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # long lines are reported by the formatter, not the linter
    "B008",  # Field(...) in defaults is the documented pydantic idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
